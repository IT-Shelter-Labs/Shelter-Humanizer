name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff==0.16.9
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_release.py
      - run: python tools/package_skill.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shelter-humanizer-windows
          path: |
            dist/windows/*.zip
            dist/windows/SHA256SUMS.txt
            dist/skill/*.zip
            dist/skill/SHA256SUMS-skill.txt
          if-no-files-found: error
